<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pill-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic background grid and connector pulse animations */
    @keyframes pulse-node {
      0%, 100% { r: 6px; opacity: 0.7; }
      50% { r: 9px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -100; }
    }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes float-badge-delayed {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }

    .node-pulse-1 { animation: pulse-node 3s infinite ease-in-out; }
    .node-pulse-2 { animation: pulse-node 4s infinite ease-in-out 1s; }
    .node-pulse-3 { animation: pulse-node 3.5s infinite ease-in-out 1.5s; }
    .node-pulse-4 { animation: pulse-node 4.5s infinite ease-in-out 0.5s; }

    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dash-flow 8s linear infinite;
    }
    .stream-line-rev {
      stroke-dasharray: 6, 6;
      animation: dash-flow 12s linear infinite reverse;
    }

    .float-1 { animation: float-badge 5s ease-in-out infinite; }
    .float-2 { animation: float-badge-delayed 6s ease-in-out infinite; }
    .float-3 { animation: float-badge 5.5s ease-in-out infinite 0.7s; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="360" fill="url(#bg-glow)" />

  <!-- Animated Circuit Grid / Enterprise Connector Topology (Background only) -->
  <g opacity="0.22">
    <!-- Grid horizontal & vertical lines -->
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" stroke="#1e293b" stroke-width="1" />
    <path d="M 150 0 L 150 360 M 300 0 L 300 360 M 450 0 L 450 360 M 600 0 L 600 360 M 750 0 L 750 360 M 900 0 L 900 360 M 1050 0 L 1050 360" stroke="#1e293b" stroke-width="1" />

    <!-- Animated Data Flow Streams -->
    <path d="M 60 120 H 280 L 350 180 H 850 L 920 120 H 1140" fill="none" stroke="#38bdf8" stroke-width="2" class="stream-line" />
    <path d="M 100 240 H 320 L 400 180 H 800 L 880 240 H 1100" fill="none" stroke="#818cf8" stroke-width="2" class="stream-line-rev" />
    <path d="M 200 60 V 160 L 260 220 V 310" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4, 4" />
    <path d="M 1000 60 V 150 L 940 210 V 310" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4, 4" />
  </g>

  <!-- Pulsing Connector Junction Nodes (Background) -->
  <g>
    <circle cx="280" cy="120" r="6" fill="#38bdf8" class="node-pulse-1" />
    <circle cx="350" cy="180" r="6" fill="#818cf8" class="node-pulse-2" />
    <circle cx="850" cy="180" r="6" fill="#818cf8" class="node-pulse-3" />
    <circle cx="920" cy="120" r="6" fill="#c084fc" class="node-pulse-4" />
    <circle cx="320" cy="240" r="5" fill="#38bdf8" class="node-pulse-2" />
    <circle cx="880" cy="240" r="5" fill="#a855f7" class="node-pulse-1" />
  </g>

  <!-- Ambient Dynamic Floating Badges (Edges only - never overlapping center text) -->
  <g class="float-1">
    <!-- Left Top: SAP & Salesforce -->
    <g transform="translate(60, 48)">
      <rect width="130" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="36" y="22" fill="#e2e8f0" font-size="12" font-weight="600">⚡ SAP S/4HANA</text>
    </g>
  </g>

  <g class="float-2">
    <!-- Left Bottom: NetSuite & Workday -->
    <g transform="translate(70, 275)">
      <rect width="140" height="34" rx="17" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" opacity="0.9" />
      <circle cx="20" cy="17" r="5" fill="#818cf8" />
      <text x="36" y="22" fill="#e2e8f0" font-size="12" font-weight="600">🔄 Oracle NetSuite</text>
    </g>
  </g>

  <g class="float-3">
    <!-- Right Top: ServiceNow & Workato -->
    <g transform="translate(1000, 48)">
      <rect width="140" height="34" rx="17" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" opacity="0.9" />
      <circle cx="20" cy="17" r="5" fill="#c084fc" />
      <text x="36" y="22" fill="#e2e8f0" font-size="12" font-weight="600">✨ ServiceNow AI</text>
    </g>
  </g>

  <g class="float-1">
    <!-- Right Bottom: Workday & MuleSoft -->
    <g transform="translate(1005, 275)">
      <rect width="135" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="36" y="22" fill="#e2e8f0" font-size="12" font-weight="600">🚀 Workday HCM</text>
    </g>
  </g>

  <!-- FOREGROUND TEXT CONTAINER (Crisp, High Contrast, Centered) -->
  <g id="foreground-content">
    <!-- Category Mini-Pill -->
    <g transform="translate(450, 48)">
      <rect width="300" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="16" r="4" fill="#38bdf8" />
      <text x="34" y="21" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE INTEGRATION &amp; IPAAS</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="url(#title-gradient)" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Turnkey Enterprise Connectors
    </text>
    <text x="600" y="145" text-anchor="middle" fill="url(#title-gradient)" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Turnkey Enterprise Connectors
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="600" letter-spacing="0.2">
      Curated Commercial iPaaS Platforms &amp; Open-Source Enterprise Integration Frameworks
    </text>

    <!-- Detailed Capability Line -->
    <text x="600" y="232" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="400">
      Production Connectors for SAP • Salesforce • NetSuite • Workday • ServiceNow • Oracle EBS • AI MCP Servers
    </text>

    <!-- Central Tech Pill Highlights -->
    <g transform="translate(365, 265)">
      <!-- Pill 1: Commercial iPaaS -->
      <g transform="translate(0, 0)">
        <rect width="145" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="72" y="19" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">☁️ Enterprise SaaS</text>
      </g>
      <!-- Pill 2: Open-Source -->
      <g transform="translate(160, 0)">
        <rect width="145" height="30" rx="15" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
        <text x="72" y="19" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="600">🔓 100% Open-Source</text>
      </g>
      <!-- Pill 3: Turnkey Recipes -->
      <g transform="translate(320, 0)">
        <rect width="150" height="30" rx="15" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
        <text x="75" y="19" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="600">⚡ Turnkey Workflows</text>
      </g>
    </g>
  </g>
</svg>
